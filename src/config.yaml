# Current production origin. Update this one value when an approved domain migration is ready.
site:
  name: Zipzi 2D
  site: 'https://zipzi2d.com'
  base: '/'
  trailingSlash: true
metadata:
  title:
    default: 'Zipzi 2D — Open Source Live2D Cubism Editor Alternative'
    template: '%s | Zipzi 2D'
  description: 'An open source Live2D Cubism Editor alternative for 2D modeling and animation. GPL editor, MIT SDK, and Python AI workflows. Download the macOS and Windows Alpha.'
  robots:
    index: true
    follow: true
  openGraph:
    images:
      - url: '/media/editor-screenshot.jpg'
        width: 2204
        height: 1486
    type: website
  twitter:
    cardType: summary_large_image
i18n:
  language: en
  textDirection: ltr
apps:
  blog:
    isEnabled: false
ui:
  theme: 'light:only'
