name: Website CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Static site, accessibility and browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install exactly the reviewed lockfile
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Type and source checks
        run: |
          npm run check
          npm run lint
      - name: Build and test generated artifacts
        run: |
          npm run build
          npm test
      - name: Offline deployment and rollback tests
        run: npm run test:deploy
      - name: Repeat filesystem boundary tests as root in the disposable runner
        run: sudo -n /usr/bin/python3 -B -m unittest discover -s tests/deploy -v
      - name: Verify reproducibility
        run: |
          cp qa/build-manifest.json /tmp/first-build.json
          npm run build
          cmp /tmp/first-build.json qa/build-manifest.json
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Browser, keyboard, responsive and WCAG regression
        run: npm run test:browser
      - name: Package and audit publication
        run: |
          npm run package
          npm run audit:publication
          cd artifact
          sha256sum --check SHA256SUMS
      - name: Save verified website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zipzi-site-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-browser-evidence-${{ github.sha }}
          path: |
            qa/browser-report/
            qa/browser-results/
            qa/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Explain production deployment status
        if: always()
        env:
          DEPLOY_ENABLED: ${{ vars.ZIPZI_DEPLOY_ENABLED }}
        run: |
          if [ "$GITHUB_REPOSITORY" != 'getzipzi/zipzi-site' ] || [ "$GITHUB_EVENT_NAME" != 'push' ] || [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'Production deployment is disabled for this run. No production connection was attempted; the deployment job is skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deployment is eligible only after all verification steps succeed. Its separate job reports the actual result.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    name: Deploy verified static files (requires approved configuration)
    needs: verify
    if: github.repository == 'getzipzi/zipzi-site' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ZIPZI_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: zipzi-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this successful run's verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "zipzi-site-$GITHUB_SHA" --dir incoming
      - name: Deploy with strict host verification and server rollback
        env:
          GH_TOKEN: ${{ github.token }}
          ZIPZI_DEPLOY_SSH_KEY: ${{ secrets.ZIPZI_DEPLOY_SSH_KEY }}
          ZIPZI_DEPLOY_KNOWN_HOSTS: ${{ vars.ZIPZI_DEPLOY_KNOWN_HOSTS }}
          ZIPZI_DEPLOY_HOST: ${{ vars.ZIPZI_DEPLOY_HOST }}
          ZIPZI_DEPLOY_USER: ${{ vars.ZIPZI_DEPLOY_USER }}
        run: python3 -I tooling/deploy/client.py incoming
