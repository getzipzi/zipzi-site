name: Website CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
      - name: Lint source and release disclosures
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify build and release metadata
        run: npm test
      - name: Verify reproducible build
        run: |
          cp qa/build-manifest.json /tmp/first-build.json
          npm run build
          cmp /tmp/first-build.json qa/build-manifest.json
      - name: Package verified build
        run: |
          npm run package
          cd artifact
          sha256sum --check SHA256SUMS
      - name: Save build for deployment review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zipzi-site-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
