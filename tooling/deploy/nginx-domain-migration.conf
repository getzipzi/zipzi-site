server {
    listen 80;
    listen [::]:80;
    server_name clwai.cn www.clwai.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clwai.cn www.clwai.cn;

    root /var/www/fa-stock-research/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/clwai.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clwai.cn/privkey.pem; # managed by Certbot
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/admin/ {
        auth_basic "FA Stock Research Admin";
        auth_basic_user_file /etc/fa-stock-research/nginx.htpasswd;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /jobs {
        auth_basic "FA Stock Research Admin";
        auth_basic_user_file /etc/fa-stock-research/nginx.htpasswd;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /__zipzi_internal_jobs;
    }

    # The original jobs entry remains protected and outside the public site root.
    location = /__zipzi_internal_jobs {
        internal;
        auth_basic "FA Stock Research Admin";
        auth_basic_user_file /etc/fa-stock-research/nginx.htpasswd;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        alias /var/www/fa-stock-research/legacy/jobs.html;
        default_type text/html;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /robots.txt {
        return 301 https://zipzi2d.com$request_uri;
    }

    location ~ ^/sitemap(?:-index|-0)?\.xml$ {
        return 301 https://zipzi2d.com$request_uri;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        return 301 https://zipzi2d.com$request_uri;
    }


}

server {
    listen 80;
    listen [::]:80;
    server_name zipzi2d.com www.zipzi2d.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://zipzi2d.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zipzi2d.com;
    ssl_certificate /etc/letsencrypt/live/zipzi2d.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipzi2d.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://zipzi2d.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zipzi2d.com;
    root /var/www/fa-stock-research/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/zipzi2d.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipzi2d.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Backend services remain on the existing authenticated legacy hosts.
    location ^~ /jobs { return 404; }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /__zipzi_internal_jobs { return 404; }
    location ^~ /assets/ { return 404; }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /robots.txt {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ ^/sitemap(?:-index|-0)?\.xml$ {
        types { }
        default_type application/xml;
        try_files $uri =404;
    }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
    location = /zh-cn/404.html {
        internal;
        try_files $uri /404.html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /zh-cn/ {
        add_header Cache-Control "no-store" always;
        error_page 404 /zh-cn/404.html;
        try_files $uri $uri/ =404;
    }
    location = /ja/404.html {
        internal;
        try_files $uri /404.html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /ja/ {
        add_header Cache-Control "no-store" always;
        error_page 404 /ja/404.html;
        try_files $uri $uri/ =404;
    }
    location = /zh-tw/404.html {
        internal;
        try_files $uri /404.html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /zh-tw/ {
        add_header Cache-Control "no-store" always;
        error_page 404 /zh-tw/404.html;
        try_files $uri $uri/ =404;
    }
    location = /en/404.html {
        internal;
        try_files $uri /404.html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /en/ {
        add_header Cache-Control "no-store" always;
        error_page 404 /en/404.html;
        try_files $uri $uri/ =404;
    }
    location = /ko/404.html {
        internal;
        try_files $uri /404.html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /ko/ {
        add_header Cache-Control "no-store" always;
        error_page 404 /ko/404.html;
        try_files $uri $uri/ =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        error_page 404 /404.html;
        try_files $uri $uri/ =404;
    }
}
